[workspace]
resolver = "2"
members = ["gascii-core", "gascii", "gascii-plugin-api", "gascii-density-brush", "gascii-anim", "gascii-stylus", "gascii-layers"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/grontis/gascii"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
rfd = "0.17"
arboard = "3"
ctrlc = "3"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# Arithmetic overflow panics loudly in release builds too, instead of wrapping silently — the
# codebase leans on overflow panics to surface index-math bugs, and the cost is negligible for
# this workload.
[profile.release]
overflow-checks = true
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
